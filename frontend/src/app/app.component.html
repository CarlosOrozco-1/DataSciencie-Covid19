<!--
  Plantilla shell de la aplicación.
  Define navegación principal y contenedor de rutas.
-->

<header class="app-header">
  <div class="header-content">
    <h1>Dashboard COVID-19 Guatemala</h1>
    <p class="subtitle">Visualización territorial y módulo ESAVI</p>
  </div>
</header>

<nav class="top-nav">
  <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Mapa COVID</a>
  <a routerLink="/esavi" routerLinkActive="active">Análisis ESAVI</a>
</nav>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p>Datos del Ministerio de Salud Pública y Asistencia Social de Guatemala</p>
  <p>Proyecto desarrollado con Python (FastAPI) + Angular + D3.js</p>
</footer>
